# netlify.toml

[build]
  # Команда для сборки вашего проекта
  command = "npm run build"
  
  # Директория, которую Netlify будет публиковать
  publish = "dist"
  
  # Директория с вашими серверными функциями
  functions = "netlify/functions"

[dev]
  # Команда для запуска сервера разработки
  command = "npm run dev"
  
  # Порт, на котором работает ваш dev-сервер (Vite по умолчанию 5173)
  targetPort = 5173
  
  # Автоматически открывать браузер
  autoLaunch = true

# Этот редирект делает ваши функции доступными по адресу /api/*
# Например, /netlify/functions/sendMessage будет доступен как /api/sendMessage
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
